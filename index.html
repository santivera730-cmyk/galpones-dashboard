<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard de Galpones</title>
    <link rel="stylesheet" href="style.css" />

    <!-- Importar gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <header>
        <h1>Dashboard de Galpones</h1>
    </header>

    <div class="container">

        <!-- PANEL LATERAL -->
        <aside class="sidebar">
            <h2>Galpones</h2>
            <ul>
                <li onclick="selectGalpon(1)">Galpón 1</li>
                <li onclick="selectGalpon(2)">Galpón 2</li>
                <li onclick="selectGalpon(3)">Galpón 3</li>
                <li onclick="selectGalpon(4)">Galpón 4</li>
            </ul>
        </aside>

        <!-- PANEL PRINCIPAL -->
        <main class="content">

            <h2 id="titulo-galpon">Galpón 1</h2>

            <!-- CARDS DE DATOS -->
            <div class="cards">
                <div class="card">
                    <h3>Temperatura</h3>
                    <p id="temp">-- °C</p>
                </div>

                <div class="card">
                    <h3>Humedad</h3>
                    <p id="humedad">-- %</p>
                </div>

                <div class="card">
                    <h3>Mortandad</h3>
                    <p id="mortandad">-- aves</p>
                </div>

                <div class="card">
                    <h3>Consumo (Alimento)</h3>
                    <p id="consumo">-- kg</p>
                </div>
            </div>

            <!-- GRÁFICO -->
            <div class="chart-container">
                <canvas id="chart"></canvas>
            </div>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
