<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>Panel de Control - Galpones</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <aside class="sidebar">
        <h2>🐔 Galpones</h2>
        <nav>
            <a href="#" class="active">Panel General</a>
            <a href="#">Producción</a>
            <a href="#">Alimentación</a>
            <a href="#">Ambiente</a>
            <a href="#">Mortalidad</a>
            <a href="#">Proyección</a>
        </nav>
    </aside>

    <main class="content">
        <header>
            <h1>Panel de Control</h1>

            <select id="selector-galpon">
                <option value="1">Galpón 1</option>
                <option value="2">Galpón 2</option>
                <option value="3">Galpón 3</option>
                <option value="4">Galpón 4</option>
            </select>
        </header>

        <section class="dashboard">

            <!-- PRODUCCIÓN DIARIA -->
            <div class="card large">
                <h3>Producción diaria</h3>
                <canvas id="produccionDiaria"></canvas>
            </div>

            <!-- POSTURA -->
            <div class="card medium">
                <h3>% de postura</h3>
                <p class="numero" id="posturaNumero">--%</p>
                <canvas id="graficoPostura"></canvas>
            </div>

            <!-- RECOMENDACIONES -->
            <div class="card medium">
                <h3>Recomendaciones</h3>
                <ul id="listaRecomendaciones"></ul>
            </div>

            <!-- PRODUCCIÓN PROYECTADA -->
            <div class="card large">
                <h3>Producción proyectada</h3>
                <canvas id="proyeccion"></canvas>
            </div>

            <!-- TEMPERATURA -->
            <div class="card medium">
                <h3>Temperatura</h3>
                <canvas id="temperaturaGrafico"></canvas>
            </div>

            <!-- HUMEDAD -->
            <div class="card medium">
                <h3>Humedad</h3>
                <canvas id="humedadGrafico"></canvas>
            </div>

            <!-- MORTALIDAD -->
            <div class="card medium">
                <h3>Mortalidad diaria</h3>
                <canvas id="mortalidadGrafico"></canvas>
            </div>

            <!-- COMEDERO -->
            <div class="card medium">
                <h3>Consumo de alimento (kg)</h3>
                <canvas id="alimentoGrafico"></canvas>
            </div>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
