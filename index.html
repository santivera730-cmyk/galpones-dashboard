<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard de Galpones</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2>GALPONES</h2>

        <label>Seleccionar galpón:</label>
        <select id="selector-galpon">
            <option value="1">Galpón 1</option>
            <option value="2">Galpón 2</option>
            <option value="3">Galpón 3</option>
            <option value="4">Galpón 4</option>
        </select>

        <h3>Paneles</h3>
        <button data-section="inicio">📊 Resumen general</button>
        <button data-section="produccion">🥚 Producción</button>
        <button data-section="ambiente">🌡️ Temperatura / Humedad</button>
        <button data-section="sanidad">💀 Mortalidad</button>
        <button data-section="alimento">🍽️ Consumo alimento</button>
        <button data-section="recomendaciones">⚠ Recomendaciones</button>
    </aside>

    <!-- CONTENIDO -->
    <main>

        <!-- SECCIÓN RESUMEN -->
        <section id="inicio" class="section">
            <h1>Resumen general</h1>

            <div class="tarjetas">
                <div class="card">
                    <h2>Postura</h2>
                    <p id="posturaNumero" class="numeroGrande">--%</p>
                </div>

                <div class="card">
                    <h2>Producción semanal</h2>
                    <canvas id="produccionDiaria"></canvas>
                </div>

                <div class="card">
                    <h2>Proyección</h2>
                    <canvas id="proyeccion"></canvas>
                </div>
            </div>
        </section>

        <!-- PRODUCCIÓN -->
        <section id="produccion" class="section" style="display:none;">
            <h1>Producción diaria</h1>
            <canvas id="graficoPostura"></canvas>
        </section>

        <!-- AMBIENTE -->
        <section id="ambiente" class="section" style="display:none;">
            <h1>Temperatura y Humedad</h1>

            <div class="tarjetas">
                <div class="card">
                    <h2>Temperatura</h2>
                    <canvas id="temperaturaGrafico"></canvas>
                </div>

                <div class="card">
                    <h2>Humedad</h2>
                    <canvas id="humedadGrafico"></canvas>
                </div>
            </div>
        </section>

        <!-- SANIDAD -->
        <section id="sanidad" class="section" style="display:none;">
            <h1>Mortalidad</h1>
            <canvas id="mortalidadGrafico"></canvas>
        </section>

        <!-- ALIMENTO -->
        <section id="alimento" class="section" style="display:none;">
            <h1>Consumo de alimento</h1>
            <canvas id="alimentoGrafico"></canvas>
        </section>

        <!-- RECOMENDACIONES -->
        <section id="recomendaciones" class="section" style="display:none;">
            <h1>Recomendaciones</h1>
            <ul id="listaRecomendaciones"></ul>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
