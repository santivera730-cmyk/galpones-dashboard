<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Avícola</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- SIDEBAR IZQUIERDA -->
    <aside class="sidebar">
        <h2>Galpones</h2>
        <button class="btn-galpon" data-id="1">Galpón 1</button>
        <button class="btn-galpon" data-id="2">Galpón 2</button>
        <button class="btn-galpon" data-id="3">Galpón 3</button>
        <button class="btn-galpon" data-id="4">Galpón 4</button>
    </aside>

    <!-- CONTENIDO CENTRAL -->
    <main>
        <h1>Dashboard Avícola</h1>

        <div class="contenedor">
            <div class="card grande">
                <h3>Producción Diaria</h3>
                <canvas id="produccionDiaria"></canvas>
            </div>

            <div class="card mini">
                <h3>Postura</h3>
                <p id="posturaNumero" class="num-grande">--%</p>
                <canvas id="graficoPostura"></canvas>
            </div>

            <div class="card grande">
                <h3>Proyección</h3>
                <canvas id="proyeccion"></canvas>
            </div>

            <div class="card">
                <h3>Temperatura</h3>
                <canvas id="temperaturaGrafico"></canvas>
            </div>

            <div class="card">
                <h3>Humedad</h3>
                <canvas id="humedadGrafico"></canvas>
            </div>

            <div class="card">
                <h3>Mortalidad</h3>
                <canvas id="mortalidadGrafico"></canvas>
            </div>

            <div class="card">
                <h3>Consumo de alimento</h3>
                <canvas id="alimentoGrafico"></canvas>
            </div>

            <div class="card grande">
                <h3>Recomendaciones</h3>
                <ul id="listaRecomendaciones"></ul>
            </div>
        </div>
    </main>

    <script src="script.js"></script>

</body>
</html>
